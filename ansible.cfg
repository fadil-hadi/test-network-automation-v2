[defaults]
inventory          = inventory/production/hosts
roles_path         = roles
host_key_checking  = False
timeout            = 30
forks              = 10
retry_files_enabled = False
stdout_callback    = default

[callback_default]
result_format = yaml

# Vault password file — store path here, file itself is gitignored
# vault_password_file = .vault_pass
# In Semaphore: vault password is stored in Key Store, not here

# LAB runs: ansible-playbook -i inventory/lab/hosts playbooks/lab_pipeline_test.yml
# Semaphore should have TWO job templates pointing at the two inventories,
# never mix lab and production hosts in the same run.

[ssh_connection]
ssh_args = -o ConnectTimeout=10 KexAlgorithms=+diffie-hellman-group14-sha1,diffie-hellman-group1-sha1-o HostKeyAlgorithms=+ssh-rsa -o Ciphers=+aes128-cbc -o StrictHostKeyChecking=no
