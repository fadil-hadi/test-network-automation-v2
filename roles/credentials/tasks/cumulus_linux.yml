---
# Cumulus Linux is a Debian-based NOS — manage the local account as a
# normal Linux user rather than via a network_cli config push.
- name: "[Cumulus Linux] Ensure local admin user exists"
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    password: "{{ ansible_password | password_hash('sha512') }}"
    groups: sudo
    append: true
    shell: /bin/bash
  become: true
