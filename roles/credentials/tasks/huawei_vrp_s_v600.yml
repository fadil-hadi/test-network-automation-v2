---
# Huawei S-Series on VRP V600 branch (V600R022/V600R024) — e.g. S8700-4 core,
# S5735-*-V2 access units. Starts as a copy of huawei_vrp_s.yml (V200 branch).
# TODO: validate against a real V600 dev/test unit and diverge here if the
# CLI differs (AAA, SNMP, and syslog keywords are the most likely to shift
# between VRP major branches). See docs/firmware-notes.md.
# Huawei S-Series (campus/access, VRP) — local user account
# NOTE: S-series and CE-series share the VRP CLI family, so the AAA
# syntax below is the same as CE-series today. Kept as a SEPARATE file
# (per SoW section 3.1) so any S-series-specific divergence found during
# dev/test device validation can be patched here without touching CE-series.
- name: "[Huawei S] Configure local user account"
  community.network.ce_config:
    lines:
      - "aaa"
      - "  local-user {{ ansible_user }} password irreversible-cipher {{ ansible_password }}"
      - "  local-user {{ ansible_user }} privilege level 15"
      - "  local-user {{ ansible_user }} service-type ssh"
    match: line
