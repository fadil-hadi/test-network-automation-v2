---
- name: "[Brocade CER/IronWare] Configure local user account (legacy-SSH workaround via expect)"
  ansible.builtin.expect:
    command: >-
      ssh {{ legacy_ssh_crypto_args }} {{ ansible_user }}@{{ ansible_host }}
    responses:
      "[Pp]assword:\\s*$":
        - "{{ ansible_password }}"
      "[>#]\\s*$":
        - "enable"
        - "configure terminal"
        - "username {{ ansible_user }} password {{ ansible_password }}"
        - "exit"
        - "exit"
        - "exit"
    timeout: 20
  changed_when: true
  delegate_to: localhost
