---
# ============================================================
# Role: credentials — Aruba AOS-CX
# Connection: network_cli (SSH) via aoscx_config
#
# aoscx_user does NOT exist in arubanetworks.aoscx collection.
# Correct module for config commands is aoscx_config (SSH/CLI).
# Ensures the local management user account exists with the
# correct password set.
# ============================================================

- name: "[Aruba AOS-CX] Configure local management user account"
  arubanetworks.aoscx.aoscx_config:
    lines:
      - "user {{ ansible_user }} group administrators password plaintext {{ ansible_password }}"
  vars:
    ansible_connection: network_cli

