---
- name: "[Cumulus Linux] Enable SNMP server (NVUE)"
  ansible.builtin.command: "nv set system snmp-server state enabled"
  become: true
  changed_when: true

- name: "[Cumulus Linux] Configure SNMP read-only community (NVUE)"
  ansible.builtin.command: "nv set system snmp-server readonly-community {{ vault_snmp_community_ro }} access any"
  become: true
  changed_when: true

- name: "[Cumulus Linux] Configure SNMP trap destination (NVUE)"
  ansible.builtin.command: "nv set system snmp-server trap-destination {{ vault_snmp_trap_host }} vrf mgmt community-password {{ vault_snmp_community_ro }}"
  become: true
  changed_when: true

- name: "[Cumulus Linux] Apply NVUE configuration"
  ansible.builtin.command: nv config apply --assume-yes
  changed_when: true
  failed_when: false
  register: snmp_nvue_apply_result

- name: "[Cumulus Linux] Wait for switch to become reachable again"
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 60

