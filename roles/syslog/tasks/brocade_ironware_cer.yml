---
- name: "[Brocade CER/IronWare] Configure syslog destination (legacy-SSH workaround via expect)"
  ansible.builtin.expect:
    command: >-
      ssh {{ legacy_ssh_crypto_args }} {{ ansible_user }}@{{ ansible_host }}
    responses:
      "[Pp]assword:\\s*$":
        - "{{ ansible_password }}"
      "[>#]\\s*$":
        - "enable"
        - "configure terminal"
        - "logging host {{ syslog_server }}"
        - "logging facility {{ syslog_facility }}"
        - "exit"
        - "exit"
        - "exit"
    timeout: 20
  changed_when: true
  delegate_to: localhost
