---
- name: "[Brocade CER/IronWare] Configure NTP servers (legacy-SSH workaround via expect)"
  ansible.builtin.expect:
    command: >-
#      ssh -o KexAlgorithms=+diffie-hellman-group14-sha1,diffie-hellman-group1-sha1
#      -o HostKeyAlgorithms=+ssh-rsa -o Ciphers=+aes128-cbc -o StrictHostKeyChecking=no
      {{ ansible_user }}@{{ ansible_host }}
    responses:
      "[Pp]assword:\\s*$":
        - "{{ ansible_password }}"
      "[>#]\\s*$":
        - "enable"
        - "configure terminal"
        - "ntp"
        - "server {{ ntp_primary }}"
        - "server {{ ntp_secondary }}"
        - "exit"
        - "exit"
        - "exit"
        - "exit"
    timeout: 20
  changed_when: true
  delegate_to: localhost
