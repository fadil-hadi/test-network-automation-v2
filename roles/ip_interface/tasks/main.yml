---
# ============================================================
# Role: ip_interface
# Dispatcher — routes to the correct platform-specific task
# file based on device_series (set in group_vars per group).
# Valid values: huawei_vrp_s | huawei_vrp_ce | aruba_aoscx |
#               cumulus_linux | brocade_icx
# Add a new platform by dropping a "<device_series>.yml" file
# next to this one and adding it to the assert list below.
# ============================================================

- name: "[ip_interface] Fail fast if device_series is missing/unsupported"
  ansible.builtin.assert:
    that:
      - device_series is defined
      - device_series in ['huawei_vrp_s', 'huawei_vrp_s_v600', 'huawei_vrp_ce', 'aruba_aoscx', 'cumulus_linux', 'brocade_icx']
    fail_msg: >-
      device_series '{{ device_series | default("UNDEFINED") }}' is not set or not supported
      on host {{ inventory_hostname }}. Set it in the group's group_vars/<group>/vars.yml.

- name: "[ip_interface] Include platform-specific tasks for {{ device_series }}"
  ansible.builtin.include_tasks: "{{ device_series }}.yml"
