---
# Huawei S-Series on VRP V600 branch (V600R022/V600R024) — e.g. S8700-4 core,
# S5735-*-V2 access units. Starts as a copy of huawei_vrp_s.yml (V200 branch).
# TODO: validate against a real V600 dev/test unit and diverge here if the
# CLI differs (AAA, SNMP, and syslog keywords are the most likely to shift
# between VRP major branches). See docs/firmware-notes.md.
- name: "[Huawei S] Configure VLANIF IP interfaces"
  when: vlan_interfaces is defined
  loop: "{{ vlan_interfaces | default([]) }}"
  loop_control:
    label: "VLANIF{{ item.vlan_id }}"
  community.network.ce_config:
    lines:
      - "interface Vlanif{{ item.vlan_id }}"
      - "  description {{ item.description }}"
      - "  ip address {{ item.ip }} {{ item.mask }}"
      - "  undo shutdown"
    match: line
