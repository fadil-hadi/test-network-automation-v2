---
- name: "[Brocade CER] Functional SNMP check via SSH — query sysName OID"
  ansible.builtin.expect:
    command: >-
      ssh {{ legacy_ssh_crypto_args }} {{ ansible_user }}@{{ ansible_host }}
    responses:
      "[Pp]assword:\\s*$":
        - "{{ ansible_password }}"
      "[>#]\\s*$":
        - "enable"
        - "show snmp"
        - "exit"
        - "exit"
    timeout: 20
  delegate_to: localhost
  changed_when: false
  register: verify_snmp_result
  ignore_errors: true

- name: "Record SNMP check result"
  ansible.builtin.set_fact:
    verify_snmp_status: "{{ 'PASS' if verify_snmp_result.rc == 0 else 'FAIL' }}"
    verify_snmp_detail: "{{ verify_snmp_result.stdout | default('no output captured') }}"

