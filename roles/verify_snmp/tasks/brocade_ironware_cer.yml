---
- name: "[Brocade CER] Functional SNMP check — actual query, not config-only"
  ansible.builtin.command: >-
    snmpget -v2c -c {{ vault_snmp_community_ro }} -t 5 -r 1
    {{ ansible_host }} 1.3.6.1.2.1.1.5.0
  delegate_to: localhost
  changed_when: false
  register: snmp_result
  ignore_errors: true

- name: "Record SNMP check result"
  ansible.builtin.set_fact:
    audit_snmp_status: "{{ 'PASS' if snmp_result.rc == 0 else 'FAIL' }}"
    audit_snmp_detail: "{{ snmp_result.stdout if snmp_result.rc == 0 else snmp_result.stderr }}"
