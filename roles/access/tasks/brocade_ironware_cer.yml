---
- name: "[Brocade CER/IronWare] Enable SSH server via RSA host key (legacy-SSH workaround via expect)"
  ansible.builtin.expect:
    command: >-
      ssh -o KexAlgorithms=+diffie-hellman-group14-sha1,diffie-hellman-group1-sha1
      -o HostKeyAlgorithms=+ssh-rsa -o Ciphers=+aes128-cbc -o StrictHostKeyChecking=no
      {{ ansible_user }}@{{ ansible_host }}
    responses:
      "[Pp]assword:\\s*$":
        - "{{ ansible_password }}"
      "[>#]\\s*$":
        - "enable"
        - "configure terminal"
        - "crypto key client generate rsa modulus 2048"
        - "exit"
        - "exit"
        - "exit"
    timeout: 30
  changed_when: true
  delegate_to: localhost

- name: "[Brocade CER/IronWare] Confirm no HTTPS/web management to enable"
  ansible.builtin.debug:
    msg: >-
      No web/HTTPS management subsystem exists on this platform — SSH
      via generated RSA key is the only remote management transport
      hardened here.
