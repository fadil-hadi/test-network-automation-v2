---
# ============================================================
# Role: access — Aruba AOS-CX
# Connection: network_cli (SSH) via aoscx_config
#
# Enables SSH and HTTPS management on the mgmt VRF.
# https-server rest access-mode read-write is required for
# pyaoscx REST API modules to connect.
# ============================================================

- name: "[Aruba AOS-CX] Enable SSH server and HTTPS management on mgmt VRF"
  arubanetworks.aoscx.aoscx_config:
    lines:
      - "ssh server vrf mgmt"
      - "https-server vrf mgmt"
      - "https-server rest access-mode read-write"
  vars:
    ansible_connection: network_cli
