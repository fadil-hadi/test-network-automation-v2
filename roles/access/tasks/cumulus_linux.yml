---
- name: "[Cumulus Linux] Enable SSH server (NVUE)"
  ansible.builtin.command: "nv set system ssh-server state enabled"
  become: true
  changed_when: true

- name: "[Cumulus Linux] Enable REST API over HTTPS (NVUE)"
  ansible.builtin.command: "nv set system api state enabled"
  become: true
  changed_when: true

- name: "[Cumulus Linux] Apply NVUE configuration"
  ansible.builtin.command: nv config apply --assume-yes
  changed_when: true
  failed_when: false
  register: access_nvue_apply_result

- name: "[Cumulus Linux] Wait for switch to become reachable again"
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 60

