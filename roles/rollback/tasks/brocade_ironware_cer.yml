---
# ── Rollback credentials ──────────────────────────────────────
# Forward: username password only (NO privilege line on CER)
# Rollback: nothing to undo — session used for reachability check only
#- name: "[Rollback][Brocade CER] Undo credentials — verify reachability"
# changed_when: false   ← show version only, no config change

# ── Rollback hardening ────────────────────────────────────────
# Forward: no telnet server ONLY (no web/http — CER has no web subsystem)
# Rollback: telnet server only — no HTTP to re-enable
- name: "[Rollback][Brocade CER] Undo hardening — re-enable Telnet only"
  ansible.builtin.expect:
    command: >-
      ssh {{ legacy_ssh_crypto_args }} {{ ansible_user }}@{{ ansible_host }}
    responses:
      "[Pp]assword:\\s*$":
        - "{{ ansible_password }}"
      "[>#]\\s*$":
        - "enable"
        - "configure terminal"
        - "telnet server"
        - "exit"
        - "exit"
        - "exit"
        - "exit"
    timeout: 20
  changed_when: true
  delegate_to: localhost

