---
# ============================================================
# Master playbook — runs all roles in correct push order
# Use this for full fleet push via Semaphore
# PUSH ORDER: ho_access → ho_mgmt → ho_serverfarm →
#             dc_admin → dc_tor → dc_leaf →
#             dc_spine → dc_core → aruba_ho_core (LAST)
# ============================================================

# ── TIER 1: HO Access (safest — push first) ──────────────────
- name: "Tier 1 — HO Access Switches"
  hosts: huawei_ho_access
  gather_facts: false
  serial: 10
  roles:
    - credentials
    - hardening
    - access
    - syslog
    - snmp
    - ntp

# ── TIER 2: HO Management ────────────────────────────────────
- name: "Tier 2 — HO Management Switch"
  hosts: huawei_ho_mgmt
