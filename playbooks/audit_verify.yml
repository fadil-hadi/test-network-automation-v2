---
# Functional hardening verification — proves features actually WORK,
# not just that config lines exist. Produces a CSV audit record per run.
# Scope: brocade_cer_lab only for now — extend to other groups once
# their verify_*/tasks/<device_series>.yml files exist.

- name: "Audit Verification — Brocade CER"
  hosts: brocade_cer_lab
  gather_facts: false
  tasks:
    - name: "Verify SSH access is functional"
      ansible.builtin.import_role:
        name: verify_access

    - name: "Verify SNMP is functional"
      ansible.builtin.import_role:
        name: verify_snmp

    - name: "Verify NTP is configured"
      ansible.builtin.import_role:
        name: verify_ntp

    - name: "Append this device's results to the audit report"
      ansible.builtin.lineinfile:
        path: "/tmp/audit_report_{{ '%Y%m%d_%H%M%S' | strftime }}.csv"
        create: true
        line: "{{ inventory_hostname }},{{ item.check }},{{ item.status }},{{ item.detail | replace(',', ';') }}"
        mode: '0644'
      loop:
        - check: "SSH Access"
          status: "{{ verify_access_status }}"
          detail: "{{ verify_access_detail }}"
        - check: "SNMP Functional"
          status: "{{ verify_snmp_status }}"
          detail: "{{ verify_snmp_detail }}"
        - check: "NTP Configured"
          status: "{{ verify_ntp_status }}"
          detail: "{{ verify_ntp_detail }}"
      delegate_to: localhost

    - name: "Show this device's results"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: SSH={{ verify_access_status }} | SNMP={{ verify_snmp_status }} | NTP={{ verify_ntp_status }}"

