---
# ============================================================
# Functional hardening verification
# Proves features actually WORK, not just that config lines exist.
# Produces a timestamped CSV audit report at /tmp/audit_report_*.csv
# Scope: brocade_cer_lab — extend to other groups once their
# verify_*/tasks/<device_series>.yml files exist.
# ============================================================

- name: "Audit Verification — Brocade CER"
  hosts: brocade_cer_lab
  gather_facts: false
  tasks:
    - name: "Verify SSH access is functional"
      ansible.builtin.import_role:
        name: verify_access

    - name: "Verify SNMP is functional"
      ansible.builtin.import_role:
        name: verify_snmp

    - name: "Verify NTP is configured"
      ansible.builtin.import_role:
        name: verify_ntp

    - name: "Set audit report path (shared across all hosts in play)"
      ansible.builtin.set_fact:
        audit_report_path: "/tmp/audit_report_{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}.csv"
      run_once: true
      delegate_to: localhost

    - name: "Write CSV header (once per report)"
      ansible.builtin.lineinfile:
        path: "{{ audit_report_path }}"
        create: true
        insertbefore: BOF
        line: "Host,Check,Status,Detail"
        mode: '0644'
      run_once: true
      delegate_to: localhost

    - name: "Append this device's results to the audit report"
      ansible.builtin.lineinfile:
        path: "{{ audit_report_path }}"
        create: true
        line: "{{ inventory_hostname }},{{ item.check }},{{ item.status }},{{ item.detail | replace(',', ';') }}"
        mode: '0644'
      loop:
        - check: "SSH Access"
          status: "{{ verify_access_status }}"
          detail: "{{ verify_access_detail }}"
        - check: "SNMP Functional"
          status: "{{ verify_snmp_status }}"
          detail: "{{ verify_snmp_detail }}"
        - check: "NTP Configured"
          status: "{{ verify_ntp_status }}"
          detail: "{{ verify_ntp_detail }}"
      delegate_to: localhost

    - name: "Show this device's results"
      ansible.builtin.debug:
        msg:
          - "=============================="
          - "Host   : {{ inventory_hostname }}"
          - "SSH    : {{ verify_access_status }} — {{ verify_access_detail }}"
          - "SNMP   : {{ verify_snmp_status }} — {{ verify_snmp_detail }}"
          - "NTP    : {{ verify_ntp_status }} — {{ verify_ntp_detail }}"
          - "Report : {{ audit_report_path }}"
          - "=============================="

