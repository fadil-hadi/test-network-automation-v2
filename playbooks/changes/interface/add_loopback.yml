---
# ============================================================
# Change Playbook: Add/modify loopback interface (Huawei DC)
# ── How to use ───────────────────────────────────────────────
# 1. Add loopback_interfaces list to host_vars of target device
# 2. Target specific device only
# ── When to use ─────────────────────────────────────────────
# Adding loopback for BGP router-id or management reachability
# ============================================================
- name: "Change — Add loopback on {{ target_hosts }}"
  hosts: "{{ target_hosts }}"
  gather_facts: false
  serial: 1
  roles:
    - loopback
