---
# ============================================================
# Change Playbook: Add IP interface (VLANIF/SVI) to a device
# ── How to use ───────────────────────────────────────────────
# 1. Add vlan_interfaces list to the target device host_vars
#    inventory/host_vars/<hostname>/vars.yml
# 2. Run this playbook targeting that specific device
# ── How to use in Semaphore ──────────────────────────────────
# Extra Variables:
#   target_hosts : "dc-core-01"   (specific device only!)
# ── When to use ─────────────────────────────────────────────
# FIF wants to add a new routed interface to a core/spine device
# ALWAYS target a specific host — never a full group
# ============================================================
- name: "Change — Add IP interfaces on {{ target_hosts }}"
  hosts: "{{ target_hosts }}"
  gather_facts: false
  serial: 1
  roles:
    - ip_interface
