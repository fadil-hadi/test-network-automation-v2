---
# ============================================================
# Change Playbook: Add VLAN to trunk/uplink port
# ── How to use in Semaphore ──────────────────────────────────
# Extra Variables:
#   interface_name  : "GigabitEthernet0/0/24"
#   trunk_vlan_list : "100,200,300"
#   target_hosts    : "specific-switch-hostname"
# ── When to use ─────────────────────────────────────────────
# FIF wants to allow new VLANs on an uplink/trunk port
# Typically used on TOR or distribution switches
# ============================================================
- name: "Change — Add VLANs {{ trunk_vlan_list }} to trunk {{ interface_name }} on {{ target_hosts }}"
  hosts: "{{ target_hosts }}"
  gather_facts: false
  serial: 1
  roles:
    - vlan_trunk_port
