---
# ============================================================
# Change Playbook: Assign interface to VLAN (access port)
# ── How to use in Semaphore ──────────────────────────────────
# Extra Variables:
#   interface_name : "GigabitEthernet0/0/1"  (Huawei)
#                    "1/1/1"                  (Aruba)
#   vlan_id        : 100
#   target_hosts   : "specific-switch-hostname"
# ── When to use ─────────────────────────────────────────────
# FIF wants to move a port to a different VLAN (access mode)
# ============================================================
- name: "Change — Assign {{ interface_name }} to VLAN {{ vlan_id }} on {{ target_hosts }}"
  hosts: "{{ target_hosts }}"
  gather_facts: false
  serial: 1
  roles:
    - vlan_access_port
