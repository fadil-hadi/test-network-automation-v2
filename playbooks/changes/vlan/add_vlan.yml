---
# ============================================================
# Change Playbook: Add VLAN to device group
# ── How to use in Semaphore ──────────────────────────────────
# Extra Variables:
#   vlan_id     : 100
#   vlan_name   : "FINANCE"
#   target_hosts: "huawei_ho_access"   (or specific hostname)
# ── When to use ─────────────────────────────────────────────
# FIF requests a new VLAN be created on access or TOR switches
# ============================================================
- name: "Change — Add VLAN {{ vlan_id }} ({{ vlan_name }}) to {{ target_hosts }}"
  hosts: "{{ target_hosts }}"
  gather_facts: false
  serial: 5
  roles:
    - vlan
